<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PEACETHREADS — Welcome</title>
<style>
  :root{
    --bg-1:#fdf9f5;
    --bg-2:#f7ebe6;
    --bg-3:#f0dfe0;
    --ink:#2a1c28;
    --ink-soft:#5a4655;
    --rose:#c97a94;
    --rose-deep:#a8526e;
    --rose-soft:#e8b4c8;
    --champagne:#b8924a;
    --champagne-soft:#e6cf9a;
    --blush:#f5dde6;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{ height:100%; }

  body{
    background:
      radial-gradient(ellipse at 30% 25%, #fff9f4 0%, #f7ebe6 45%, #f0dfe0 100%);
    color:var(--ink);
    font-family: 'Cormorant Garamond', 'Didot', 'Playfair Display', Georgia, 'Times New Roman', serif;
    min-height:100vh;
    min-height:100dvh; /* modern mobile-safe viewport */
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    transition: opacity .7s ease, transform .7s ease;
    padding: 1.25rem; /* safe area — nothing ever touches the edges */
  }

  body.leaving{
    opacity:0;
    transform: scale(1.03);
    pointer-events:none;
  }

  /* ---- decorative background aura ---- */
  body::before{
    content:"";
    position:absolute;
    top:-30%; left:-15%;
    width:75%; height:90%;
    background:radial-gradient(circle, rgba(232,180,200,.35) 0%, transparent 65%);
    animation: auraBreath 9s ease-in-out infinite;
    pointer-events:none;
  }
  body::after{
    content:"";
    position:absolute;
    bottom:-25%; right:-15%;
    width:60%; height:75%;
    background:radial-gradient(circle, rgba(230,207,154,.22) 0%, transparent 65%);
    animation: auraBreath 11s ease-in-out infinite reverse;
    pointer-events:none;
  }
  @keyframes auraBreath{
    0%,100%{ opacity:.6; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.12); }
  }

  /* ---- faint diagonal couture lines ---- */
  .lines{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:1;
    opacity:.5;
  }
  .lines span{
    position:absolute;
    height:1px;
    background:linear-gradient(90deg,
      transparent 0%,
      rgba(201,122,148,.25) 50%,
      transparent 100%);
    animation: drift 14s ease-in-out infinite;
  }
  .lines span:nth-child(1){ top:20%; left:-5%; width:40%; animation-delay:0s; }
  .lines span:nth-child(2){ top:38%; right:-5%; width:45%; animation-delay:-3s; transform:rotate(180deg); }
  .lines span:nth-child(3){ top:62%; left:-8%; width:35%; animation-delay:-6s; }
  .lines span:nth-child(4){ top:80%; right:-10%; width:30%; animation-delay:-9s; transform:rotate(180deg); }
  @keyframes drift{
    0%,100%{ opacity:.3; transform:translateX(0); }
    50%{ opacity:.9; transform:translateX(12px); }
  }

  /* ============================================================
     STAGE — fluid sizing, no fixed breakpoints needed
     ============================================================ */
  .stage{
    position:relative;
    z-index:10;
    text-align:center;
    padding: clamp(1rem, 3.5vw, 3rem) clamp(.9rem, 3.5vw, 2rem);
    max-width: min(1080px, 92vw);
    width:100%;
    margin: 0 auto;
    animation: revealIn 1.8s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes revealIn{
    from{ opacity:0; transform: translateY(30px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* ---- eyebrow ---- */
  .eyebrow{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap: clamp(.5rem, 1.1vw, .9rem);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    font-size: clamp(.5rem, 1vw, .68rem);
    font-weight:500;
    letter-spacing: clamp(.22em, 1.8vw, .42em);
    text-transform:uppercase;
    color:var(--rose-deep);
    margin-bottom: clamp(1.2rem, 3vw, 2.4rem);
    padding-left: clamp(.22em, 1.8vw, .42em); /* optical centering */
    text-align:center;
    animation: fadeUp 1.4s cubic-bezier(.2,.8,.2,1) .2s both;
    max-width: 100%;
    flex-wrap: nowrap;
  }
  .eyebrow::before,
  .eyebrow::after{
    content:"";
    width: clamp(16px, 3vw, 44px);
    height:1px;
    background:linear-gradient(90deg, transparent, var(--rose));
    flex-shrink:0;
  }
  .eyebrow::after{
    background:linear-gradient(90deg, var(--rose), transparent);
  }

  /* ---- house name ---- */
  .house{
  font-family: inherit;
  font-weight:400;
  font-size: clamp(1.35rem, 7.5vw, 6rem);      /* ← smaller minimum, softer vw curve */
  letter-spacing: clamp(.06em, 1.6vw, .22em);   /* ← tighter minimum tracking */
  line-height:1.05;
  color:var(--ink);
  margin: 0 0 clamp(.9rem, 2.2vw, 1.6rem) 0;
  padding-left: clamp(.06em, 1.6vw, .22em);     /* matches the new letter-spacing */
  text-align:center;
  white-space: nowrap;                          /* ← never break the line */
  overflow-wrap: normal;
  word-break: normal;
  animation: fadeUp 1.4s cubic-bezier(.2,.8,.2,1) .35s both;
  max-width: 100%;
}
.house .dot{ color:var(--rose); }

  /* ---- tagline ---- */
  .tagline{
    font-style: italic;
    font-weight: 300;
    font-size: clamp(.95rem, 2vw, 1.5rem);
    line-height: 1.55;
    color: var(--ink-soft);
    max-width: min(520px, 90%);
    margin: 0 auto clamp(.9rem, 1.8vw, 1.2rem);
    text-align:center;
    animation: fadeUp 1.4s cubic-bezier(.2,.8,.2,1) .5s both;
  }

  /* ---- divider ornament ---- */
  .ornament{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: clamp(.55rem, 1.1vw, .9rem);
    margin: clamp(1.5rem, 3.6vw, 2.6rem) auto clamp(1.7rem, 4vw, 3rem);
    animation: fadeUp 1.4s cubic-bezier(.2,.8,.2,1) .65s both;
  }
  .ornament .line{
    width: clamp(26px, 5vw, 60px);
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(201,122,148,.6), transparent);
  }
  .ornament .diamond{
    width: clamp(5px, .55vw, 7px);
    height: clamp(5px, .55vw, 7px);
    background:var(--rose);
    transform: rotate(45deg);
    box-shadow: 0 0 12px rgba(201,122,148,.6);
    flex-shrink:0;
  }

  /* ---- welcome button ---- */
  .welcome-btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap: clamp(.55rem, 1.1vw, 1rem);
    padding: clamp(.95rem, 1.6vw, 1.35rem) clamp(1.5rem, 3.2vw, 3rem);
    padding-left: calc(clamp(1.5rem, 3.2vw, 3rem) + clamp(.22em, 1.8vw, .28em));
    border-radius:100px;
    border:1px solid rgba(201,122,148,.55);
    background: linear-gradient(135deg, rgba(255,255,255,.9) 0%, rgba(245,221,230,.7) 100%);
    color: var(--ink);
    font-family:'Inter', -apple-system, system-ui, sans-serif;
    font-size: clamp(.58rem, 1vw, .72rem);
    font-weight:600;
    letter-spacing: clamp(.2em, 1.8vw, .28em);
    text-transform:uppercase;
    text-decoration:none;
    cursor:pointer;
    overflow:hidden;
    transition: all .55s cubic-bezier(.2,.8,.2,1);
    animation: fadeUp 1.4s cubic-bezier(.2,.8,.2,1) .85s both;
    box-shadow:
      0 0 0 rgba(201,122,148,0),
      0 8px 24px -10px rgba(168,82,110,.25);
    white-space: nowrap;
    max-width: 100%;
  }

  .welcome-btn::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:100px;
    background: radial-gradient(circle at 50% 50%,
      rgba(201,122,148,.55) 0%,
      rgba(201,122,148,.15) 40%,
      transparent 70%);
    z-index:-1;
    animation: glowPulse 3.2s ease-in-out infinite;
    filter: blur(10px);
    pointer-events:none;
  }
  @keyframes glowPulse{
    0%,100%{ opacity:.55; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.08); }
  }

  .welcome-btn::after{
    content:"";
    position:absolute;
    top:0; left:-60%;
    width:50%;
    height:100%;
    background: linear-gradient(120deg,
      transparent 0%,
      rgba(255,255,255,.75) 45%,
      rgba(255,255,255,.9) 50%,
      rgba(255,255,255,.75) 55%,
      transparent 100%);
    transform: skewX(-20deg);
    animation: shimmerSweep 4.5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes shimmerSweep{
    0%, 60%{ left:-60%; }
    85%, 100%{ left:130%; }
  }

  .welcome-btn .arrow{
    display:inline-block;
    transition: transform .4s cubic-bezier(.2,.8,.2,1);
    font-size: clamp(.72rem, .9vw, .9rem);
  }

  .welcome-btn:hover{
    background: var(--rose);
    color: #fff;
    border-color: var(--rose);
    transform: translateY(-3px);
    box-shadow:
      0 0 0 rgba(201,122,148,0),
      0 18px 50px -15px rgba(168,82,110,.55);
    letter-spacing: clamp(.24em, 2vw, .32em);
  }
  .welcome-btn:hover .arrow{ transform: translateX(6px); }
  .welcome-btn:active{ transform: translateY(-1px); }

  /* ---- footer mark ---- */
  .mark{
    position:absolute;
    bottom: clamp(.9rem, 1.8vw, 2rem);
    left:50%;
    transform: translateX(-50%);
    font-family:'Inter', -apple-system, system-ui, sans-serif;
    font-size: clamp(.38rem, .75vw, .58rem);
    letter-spacing: clamp(.18em, 1.4vw, .34em);
    text-transform:uppercase;
    color: rgba(90,70,85,.45);
    z-index:10;
    animation: fadeUp 1.6s cubic-bezier(.2,.8,.2,1) 1.1s both;
    white-space: nowrap;
    max-width: 92vw;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align:center;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(18px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* ============================================================
     ★ MEDIA QUERIES — only for cases clamp() can't handle ★
     ============================================================ */

  /* --- Ultra-wide (1800px+) — cap the stage so it doesn't stretch --- */
  @media (min-width: 1800px){
    .stage{ max-width: 1200px; }
  }

  /* --- Landscape phones (short viewport height) — top-align, compress --- */
  @media (max-height: 500px) and (orientation: landscape){
    body{ align-items:flex-start; padding: 1rem; }
    .stage{ padding: .8rem 1.2rem; }
    .eyebrow{ margin-bottom:.9rem; }
    .house{ margin-bottom:.7rem; }
    .tagline{ margin-bottom:.5rem; }
    .ornament{ margin: .9rem auto 1.1rem; }
    .mark{ display:none; }
  }

  /* --- Very tall narrow phones (20:9 aspect) — extra vertical breathing --- */
  @media (min-width: 320px) and (max-width: 480px) and (min-aspect-ratio: 1/2){
    .stage{ padding-top: 2.5rem; padding-bottom: 2.5rem; }
  }

  /* --- Foldables / very narrow (below 320px) — guarantee fit --- */
  @media (max-width: 319px){
    .house{ font-size: 1.6rem; letter-spacing: .05em; padding-left: .05em; white-space: nowrap; }
    .tagline{ font-size: .85rem; }
    .eyebrow{ font-size: .44rem; letter-spacing: .2em; padding-left: .2em; }
    .eyebrow::before, .eyebrow::after{ width: 14px; }
    .welcome-btn{ padding: .8rem 1.3rem; font-size: .5rem; letter-spacing: .18em; }
    .ornament .line{ width: 20px; }
  }

  /* --- Accessibility: reduced motion --- */
  @media (prefers-reduced-motion: reduce){
    *,
    *::before,
    *::after{
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
    .welcome-btn::before,
    .welcome-btn::after{ display:none; }
    body.leaving{ opacity:0; transform:none; }
  }
</style>
</head>
<body>

  <!-- faint couture lines -->
  <div class="lines" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
  </div>

  <main class="stage">

    <span class="eyebrow">Fashion de Couture · Benin City</span>

    <h1 class="house">PEACETHREADS<span class="dot">.</span></h1>

    <p class="tagline">
      African heritage. English tailoring.<br>
      Dressed in quiet power.
    </p>

    <div class="ornament" aria-hidden="true">
      <span class="line"></span>
      <span class="diamond"></span>
      <span class="line"></span>
    </div>

    <a href="website.html" class="welcome-btn" id="enterBtn">
      Welcome
      <span class="arrow">→</span>
    </a>

  </main>

  <span class="mark">Est. MMXVIII · Atelier Privé</span>

<script>
(function(){
  const btn = document.getElementById('enterBtn');
  const DESTINATION = btn.getAttribute('href');
  const FADE_MS = 700;

  let leaving = false;

  btn.addEventListener('click', function(e){
    e.preventDefault();
    if(leaving) return;
    leaving = true;

    document.body.classList.add('leaving');

    setTimeout(function(){
      window.location.href = DESTINATION;
    }, FADE_MS);
  });
})();
</script>

</body>
</html>
